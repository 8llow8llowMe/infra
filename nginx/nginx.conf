# NGINX 전역 설정
# - 파일 로그와 stdout/stderr 로그를 함께 운영하는 구조
# - Fail2Ban, logrotate는 파일 로그를 사용
# - Docker 로그 수집기, ELK 등은 stdout/stderr 로그를 사용

user nginx;
worker_processes auto;

# 1. 에러 로그 설정
# 파일 로그는 운영 점검용, stderr 로그는 컨테이너 로그 수집용으로 사용합니다.
error_log /var/log/nginx/error.log warn;
error_log /dev/stderr warn;

pid /var/run/nginx.pid;

events {
    # 2. 워커 프로세스 연결 수 설정
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 3. 공통 액세스 로그 포맷 정의
    # 서버명, 스킴, 클라이언트 IP, 요청 정보, 응답 코드 등을 기록합니다.
    log_format main '$server_name $scheme $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Loki/Grafana 용 프로젝트별 JSON 액세스 로그 (#35)
    # - access.log 의 main 포맷은 fail2ban 필터가 읽으므로 바꾸지 않고, 프로젝트별 파일만 이 포맷을 씁니다.
    # - request_time 은 클라이언트 기준 전체 처리 시간, upstream_response_time 은 백엔드 응답 시간입니다.
    # - 쿼리스트링(args)은 남기지 않습니다. 위치 좌표(lat/lng) 같은 사용자 정보가 중앙 로그로 퍼지지 않게 하려는 것입니다.
    log_format loki_json escape=json '{'
        '"time":"$time_iso8601",'
        '"server_name":"$server_name",'
        '"scheme":"$scheme",'
        '"remote_addr":"$remote_addr",'
        '"xff":"$http_x_forwarded_for",'
        '"cf_ip":"$http_cf_connecting_ip",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent"'
    '}';

    # 4. 액세스 로그 파일 설정
    # 파일 로그는 Fail2Ban, logrotate, 운영자 수동 확인에 사용합니다.
    access_log /var/log/nginx/access.log main;

    # 5. 기본 성능 설정
    sendfile on;
    keepalive_timeout 65;

    # 6. 응답 압축 설정
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # 7. 스캐너 경로 판별 (#37)
    # 우리 서비스에 없는 경로(dotfile · PHP 같은 서버 스크립트 · 워드프레스/관리 도구)를 찌르면 1 이 됩니다.
    # 각 server 블록의 `if ($scanner_probe) { return 444; }` 가 응답 없이 연결을 끊고,
    # fail2ban nginx-scanner jail 이 access.log 의 444 를 보고 차단합니다.
    # - $uri 는 디코딩·슬래시 정리가 끝난 경로라 %2e 같은 우회가 먹지 않습니다.
    # - /.well-known/ (ACME 인증) 은 dotfile 규칙에서 뺍니다.
    map $uri $scanner_probe {
        default 0;
        "~^/\.(?!well-known/)" 1;
        "~*/\.(env|git|svn|hg|aws|ssh|htaccess|htpasswd|ds_store|vscode|idea)(/|\.|$)" 1;
        "~*\.(php[0-9]?|phtml|asp|aspx|jsp|cgi|pl)$" 1;
        "~*^/(wp-(admin|login|includes|content|json)|xmlrpc|wordpress|phpmyadmin|pma|cgi-bin|boaform|vendor/phpunit)" 1;
    }

    # 8. 도메인별 가상 호스트 설정 포함
    include /etc/nginx/conf.d/*.conf;
}
