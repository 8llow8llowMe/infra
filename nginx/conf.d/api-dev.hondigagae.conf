# 혼디가개 개발 API 라우팅 설정
# 아키텍처(BossPickSeoul / tripmarble 동일):
#   - auth-service: api-gateway를 거치지 않고 단독으로 호출 (REST)
#   - 그 외 서비스: api-gateway 경유로 호출 (REST)
#   - Swagger: api-gateway가 auth 포함 4개 서비스 문서를 집계(aggregate)해 단일 UI로 제공
# 공통 proxy 헤더는 server 레벨에서 정의하고, 헤더를 새로 지정하지 않는 location은 이를 상속한다.
#
# 포트 대역: 혼디가개 dev 는 7xxx 다. (BossPickSeoul dev 6xxx 와 같은 호스트라 겹치면 안 된다)
#
# 인증서는 발급되어 HTTPS 블록이 활성 상태다 (2026-10-10 확인).
# ⚠️ 인증서를 새로 발급해야 할 때(도메인 이전·삭제 후 복구)는 HTTPS 블록을 먼저 주석 처리해야 한다.
#    적용 순서:
#      1) HTTPS 블록 주석 유지한 채 reload
#      2) cd ~/infra/certbot && ./init-cert-non-www.sh api-dev.hondigagae.com
#      3) HTTPS 블록 주석 해제 후 `nginx -t && nginx -s reload`

# 내부 대상: 호스트/포트가 바뀌면 여기 한 곳만 바꾸면 된다.
# dev 백엔드는 main-server(192.168.0.11, hostname raspberrypi)에 배포된다.
# (prod 백엔드는 backend-server(192.168.0.9) - api.hondigagae.conf 참고)
upstream hdg_auth_dev {
    server 192.168.0.11:7081; # auth-service-dev (단독 호출 대상)
}
upstream hdg_gateway_dev {
    server 192.168.0.11:7000; # api-gateway-dev (경유 및 Swagger 집계 대상)
}

# 1. HTTP -> HTTPS 강제 전환
server {
    listen 80;
    server_name api-dev.hondigagae.com;

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api-dev.hondigagae.com$request_uri;
    }
}

# 2. HTTPS API 처리
server {
    listen 443 ssl;
    server_name api-dev.hondigagae.com;

    ssl_certificate /etc/letsencrypt/live/api-dev.hondigagae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.hondigagae.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 요청 최대 크기 제한.
    # 백엔드 MULTIPART_MAX_REQUEST_SIZE(30MB) 와 맞춘다. 여기가 더 작으면 nginx 가 413 을 먼저 던진다.
    client_max_body_size 30M;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/hondigagae_api_dev_access.json.log loki_json;

    # 개발 API 도메인은 검색엔진 색인을 막음
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # 공통 proxy 헤더 (헤더를 재정의하지 않는 하위 location이 상속)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ─────────────────────────────────────────────
    # [A] Swagger 집계 (api-gateway가 4개 서비스 문서를 aggregate)
    #     진입 UI: https://api-dev.hondigagae.com/swagger-ui.html
    # ─────────────────────────────────────────────

    # Swagger UI 진입 경로
    location = /swagger-ui.html {
        proxy_pass http://hdg_gateway_dev;
    }

    # Swagger UI 정적 리소스 (springdoc 2.x는 /swagger-ui/ 하위에서 제공)
    location /swagger-ui/ {
        proxy_pass http://hdg_gateway_dev;
    }

    # 게이트웨이 Swagger 설정 및 통합 OpenAPI 문서
    location = /v3/api-docs {
        proxy_pass http://hdg_gateway_dev;
    }
    location /v3/api-docs/ {
        proxy_pass http://hdg_gateway_dev;
    }

    # 서비스별 OpenAPI 문서는 auth 포함 전부 api-gateway 집계 라우트로 전달한다.
    # 정규식 location이라 아래 [B]의 plain prefix(/auth-service/)보다 우선하므로,
    # /auth-service/v3/api-docs 는 게이트웨이로, 그 외 /auth-service/* 는 auth 직결로 나뉜다.
    location ~ ^/(auth-service|tour-service|plan-service|ai-service)/v3/api-docs$ {
        proxy_pass http://hdg_gateway_dev;
    }

    # ─────────────────────────────────────────────
    # [B] auth-service 단독 호출 (api-gateway 미경유)
    # ─────────────────────────────────────────────

    # 인증 API
    location ^~ /api/v1/auth {
        proxy_pass http://hdg_auth_dev;
    }

    # 회원/반려견 프로필 API
    location ^~ /api/v1/members {
        proxy_pass http://hdg_auth_dev;
    }

    # prefix 직결 (문서 경로는 위 [A] 정규식이 우선 처리)
    location /auth-service/ {
        proxy_pass http://hdg_auth_dev/;
    }

    # ─────────────────────────────────────────────
    # [C] api-gateway 경유 (그 외 REST)
    #     게이트웨이 라우트: /api/v1/{places,walk-courses,emergencies,plans,ai-plans,assistant}
    # ─────────────────────────────────────────────

    # 게이트웨이 prefix 직결
    location /api-gateway/ {
        proxy_pass http://hdg_gateway_dev/;
    }

    # AI 일정 생성 작업 상태 SSE 스트림.
    # 정규식 location이라 아래 plain prefix(/api/)보다 우선 매칭된다.
    # SSE는 버퍼링하면 이벤트가 즉시 전달되지 않으므로 반드시 끈다.
    # (ai-service 의 SSE 엔드포인트는 아직 미구현이다. 붙는 시점에 이 블록이 그대로 동작한다)
    location ~ ^/api/v1/ai-plans/jobs/[^/]+/stream$ {
        proxy_pass http://hdg_gateway_dev;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 서버 emitter 타임아웃보다 프록시가 먼저 끊지 않도록 여유 있게 잡는다.
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    # auth를 제외한 일반 REST는 api-gateway로 전달
    # ([B]의 /api/v1/auth, /api/v1/members가 더 길고 ^~ 라 우선 매칭된다.)
    location /api/ {
        proxy_pass http://hdg_gateway_dev;
    }

    # API 외 경로는 노출하지 않음
    location / {
        return 404;
    }
}
