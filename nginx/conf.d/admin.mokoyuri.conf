# commerce-foundry(MOKOYURI) 운영 어드민 라우팅 설정 (#51)
# - prod admin(commerce-admin-prod)는 backend-server(192.168.0.9:1301)에 배포된다(README 8절).
#   배포 때 Vault 에 ADMIN_BIND_PROD=192.168.0.9 를 넣어야 이 nginx 가 닿는다(기본은 루프백).
# - 어드민 쿠키는 Secure 다 — HTTPS 로만 연다. 검색엔진 색인은 dev · prod 모두 막는다.
# - 운영 배포 전에는 점검 안내(503)를 보여 주고, 배포되면 실제 응답으로 넘어간다(mokoyuri.conf 와 같다).

upstream cf_admin_prod {
    server 192.168.0.9:1301; # commerce-admin-prod
    keepalive 16;
}

# 1. HTTP — Let's Encrypt HTTP-01 챌린지 + HTTPS 전환
server {
    listen 80;
    server_name admin.mokoyuri.shop;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://admin.mokoyuri.shop$request_uri;
    }
}

# 2. HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name admin.mokoyuri.shop;
    if ($scanner_probe) { return 444; }

    ssl_certificate /etc/letsencrypt/live/admin.mokoyuri.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mokoyuri.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 상품 이미지 업로드(앱 레포 #9)를 어드민 BFF 가 받는다.
    client_max_body_size 30M;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/commerce_admin_access.json.log loki_json;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # 접속 제한이 필요하면(앱 레포 #235) 아래 주석을 풀고 허용 대역을 적는다.
    # allow 192.168.0.0/24;
    # deny all;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    error_page 502 504 = @cf_maintenance;

    location /_next/static/ {
        proxy_pass http://cf_admin_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache cf_static;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        # 하위 location 에 add_header 가 있으면 server 의 것을 상속하지 않으므로 X-Robots-Tag 를 다시 적는다
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        proxy_pass http://cf_admin_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cf_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }

    location @cf_maintenance {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 503 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOKOYURI 어드민</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#f4f4f5;color:#27272a;text-align:center}p{color:#71717a}</style></head><body><main><h1>MOKOYURI 어드민</h1><p>운영 어드민은 아직 열리지 않았습니다.</p></main></body></html>';
    }
}
