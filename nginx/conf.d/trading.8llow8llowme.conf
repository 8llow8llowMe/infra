# trading.8llow8llowme.com — 개인 도구 trading-desk (#68)
# - 앱: backend-server(192.168.0.9) 웹 컨테이너 10088. 그 뒤 백엔드 컨테이너는 호스트 포트가 없다
# - 앱이 전 경로를 로그인(세션 쿠키) 뒤에 둔다. 로그인 실패 반복은 fail2ban nginx-trading-login 이 막는다
# - 분석 진행을 SSE 로 흘리므로 버퍼링을 끄고 오래 읽는다
# - 웹 컨테이너 nginx 는 이 호스트(192.168.0.12)가 붙인 X-Real-IP 만 클라이언트 주소로 믿는다

# 1. HTTP -> HTTPS (+ 인증서 HTTP-01 챌린지)
server {
    listen 80;
    server_name trading.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://trading.8llow8llowme.com$request_uri;
    }
}

# 2. 앱
server {
    listen 443 ssl;
    server_name trading.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/trading.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 세션 쿠키가 Secure 라 HTTPS 로만 쓴다. 브라우저가 다음부터 http 로 시도하지 않게
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 요청 본문은 로그인 · 분석 요청(JSON) 뿐이다
    client_max_body_size 64k;

    location / {
        proxy_pass http://192.168.0.9:10088;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: 응답을 모으지 않고 바로 흘린다. 분석 한 번이 수 분이다
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 10s;
    }
}
