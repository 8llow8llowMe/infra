# commerce-foundry(MOKOYURI) conf 들이 함께 쓰는 http 레벨 정의 (#43)
# conf.d 는 http 블록 안에서 이름순으로 include 되므로 00- 접두어로 다른 mokoyuri conf 보다 먼저 읽힌다.
# 이름은 cf_ 접두어로 둔다 — 같은 http 블록을 쓰는 다른 프로젝트 conf 와 겹치지 않게.

# 웹소켓 업그레이드 요청에만 Connection: upgrade 를 보내고, 나머지는 빈 값으로 둬 upstream keepalive 연결을 재사용한다.
# (모든 요청에 "upgrade" 를 고정하면 요청마다 .12 → 앱 호스트 TCP 연결을 새로 연다)
map $http_upgrade $cf_connection_upgrade {
    default upgrade;
    ''      '';
}

# Next.js /_next/static 캐시. 파일명에 콘텐츠 해시가 붙어 불변이므로 배포가 바뀌어도 오래된 것을 줄 일이 없다.
# storage(.12) 는 메모리가 작아(1.9Gi) 키 영역만 메모리(10m ≈ 키 8만 개)에 두고 본문은 디스크에 둔다.
# 컨테이너 안 경로라 nginx 컨테이너를 다시 만들면 비워진다 — 캐시라 문제없다.
proxy_cache_path /var/cache/nginx/cf_static levels=1:2 keys_zone=cf_static:10m max_size=1g inactive=7d use_temp_path=off;
