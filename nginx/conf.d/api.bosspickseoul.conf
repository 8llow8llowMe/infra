# BossPickSeoul 운영 API 라우팅 설정
# 아키텍처(tripmarble 동일):
#   - auth-service: api-gateway를 거치지 않고 단독으로 호출 (REST)
#   - 그 외 서비스: api-gateway 경유로 호출 (REST)
#   - Swagger: api-gateway가 auth 포함 5개 서비스 문서를 집계(aggregate)해 단일 UI로 제공
# 공통 proxy 헤더는 server 레벨에서 정의하고, 헤더를 새로 지정하지 않는 location은 이를 상속한다.
# (WebSocket location만 Upgrade/Connection 때문에 헤더를 개별 정의한다.)

# 내부 대상: 포트만 다르면 여기 한 곳만 바꾸면 된다.
upstream bps_auth_prod {
    server 192.168.0.13:9081; # auth-service-prod (단독 호출 대상)
}
upstream bps_gateway_prod {
    server 192.168.0.13:9000; # api-gateway-prod (경유 및 Swagger 집계 대상)
}

# 1. HTTP -> HTTPS 강제 전환
server {
    listen 80;
    server_name api.bosspickseoul.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.bosspickseoul.com$request_uri;
    }
}

# 2. HTTPS API 처리
server {
    listen 443 ssl;
    server_name api.bosspickseoul.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/api.bosspickseoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bosspickseoul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 요청 최대 크기 제한
    client_max_body_size 150M;

    # 공통 proxy 헤더 (헤더를 재정의하지 않는 하위 location이 상속)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ─────────────────────────────────────────────
    # [A] Swagger 집계 (api-gateway가 5개 서비스 문서를 aggregate)
    #     진입 UI: https://api.bosspickseoul.com/swagger-ui.html
    # ─────────────────────────────────────────────

    # Swagger UI 진입 경로
    location = /swagger-ui.html {
        proxy_pass http://bps_gateway_prod;
    }

    # Swagger UI 정적 리소스 (springdoc 2.x는 /swagger-ui/ 하위에서 제공)
    location /swagger-ui/ {
        proxy_pass http://bps_gateway_prod;
    }

    # 게이트웨이 Swagger 설정 및 통합 OpenAPI 문서
    location = /v3/api-docs {
        proxy_pass http://bps_gateway_prod;
    }
    location /v3/api-docs/ {
        proxy_pass http://bps_gateway_prod;
    }

    # 서비스별 OpenAPI 문서는 auth 포함 전부 api-gateway 집계 라우트로 전달한다.
    # 정규식 location이라 아래 [B]의 plain prefix(/auth-service/)보다 우선하므로,
    # /auth-service/v3/api-docs 는 게이트웨이로, 그 외 /auth-service/* 는 auth 직결로 나뉜다.
    location ~ ^/(auth-service|commercial-service|district-service|community-service|ai-service)/v3/api-docs$ {
        proxy_pass http://bps_gateway_prod;
    }

    # ─────────────────────────────────────────────
    # [B] auth-service 단독 호출 (api-gateway 미경유)
    # ─────────────────────────────────────────────

    # 인증 API
    location ^~ /api/v1/auth {
        proxy_pass http://bps_auth_prod;
    }

    # 회원/북마크 API
    location ^~ /api/v1/members {
        proxy_pass http://bps_auth_prod;
    }

    # tripmarble 스타일 prefix 직결 (문서 경로는 위 [A] 정규식이 우선 처리)
    location /auth-service/ {
        proxy_pass http://bps_auth_prod/;
    }

    # ─────────────────────────────────────────────
    # [C] api-gateway 경유 (그 외 REST + WebSocket)
    # ─────────────────────────────────────────────

    # 게이트웨이 prefix 직결 (tripmarble 스타일)
    location = /api-gateway/ws {
        proxy_pass http://bps_gateway_prod/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }
    location /api-gateway/ {
        proxy_pass http://bps_gateway_prod/;
    }

    # 루트 WebSocket
    location = /ws {
        proxy_pass http://bps_gateway_prod/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }

    # AI 리포트 작업 상태 SSE 스트림
    # 정규식 location이라 아래 plain prefix(/api/)보다 우선 매칭된다.
    # SSE는 버퍼링하면 이벤트가 즉시 전달되지 않으므로 반드시 끈다.
    location ~ ^/api/v1/ai-reports/jobs/[^/]+/stream$ {
        proxy_pass http://bps_gateway_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 서버(SSE emitter) 타임아웃이 6분이므로 프록시가 먼저 끊지 않도록 여유 있게 잡는다.
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    # auth를 제외한 일반 REST는 api-gateway로 전달
    # ([B]의 /api/v1/auth, /api/v1/members가 더 길고 ^~ 라 우선 매칭된다.)
    location /api/ {
        proxy_pass http://bps_gateway_prod;
    }

    # API 외 경로는 노출하지 않음
    location / {
        return 404;
    }
}
