# 혼디가개 개발 웹 라우팅 설정
# - dev FE(hondigagae-frontend-web-dev)는 main-server(192.168.0.11:7300)에 배포된다.
#   (운영 FE는 backend-server(192.168.0.9:5300) — hondigagae.conf 참고)
# - dev FE 는 api-dev.hondigagae.com 을 바라본다. (Vault kv/hondigagae/frontend/dev/env)
#
# 인증서는 발급되어 HTTPS 블록이 활성 상태다 (2026-10-10 확인).
# ⚠️ 인증서를 새로 발급해야 할 때(도메인 이전·삭제 후 복구)는 HTTPS 블록을 먼저 주석 처리해야 한다.
#    ssl_certificate 파일이 없으면 nginx 가 아예 기동하지 못하고,
#    이 nginx 는 전 도메인의 단일 인그레스라 다른 서비스까지 같이 내려간다.
#
#    적용 순서:
#      1) 이 파일을 conf.d 에 두고 (HTTPS 블록은 주석 유지) reload
#         docker exec nginx nginx -t && docker exec nginx nginx -s reload
#         (아래 HTTP 블록이 HTTP-01 챌린지 경로를 열어주므로 bootstrap conf 는 따로 만들지 않는다)
#      2) 인증서 발급
#         cd ~/infra/certbot && ./init-cert-non-www.sh dev.hondigagae.com
#      3) 아래 "HTTPS" 블록 주석을 풀고 다시 `nginx -t && nginx -s reload`

# 내부 대상: 호스트/포트가 바뀌면 여기 한 곳만 바꾸면 된다.
upstream hdg_web_dev {
    server 192.168.0.11:7300; # hondigagae-frontend-web-dev
}

# 1. HTTP -> HTTPS 강제 전환 (+ Let's Encrypt HTTP-01 인증 경로)
server {
    listen 80;
    server_name dev.hondigagae.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dev.hondigagae.com$request_uri;
    }
}

# 2. HTTPS 처리
server {
    listen 443 ssl;
    server_name dev.hondigagae.com;

    ssl_certificate /etc/letsencrypt/live/dev.hondigagae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.hondigagae.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 30M;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/hondigagae_web_dev_access.json.log loki_json;

    # 개발 도메인은 검색엔진 색인을 막는다. (api-dev 와 동일 정책)
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # 공통 proxy 헤더 (헤더를 재정의하지 않는 하위 location 이 상속)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js 빌드 산출 정적 자산은 콘텐츠 해시가 붙어 불변이다.
    # 다만 dev 는 배포가 잦아 오래 캐시하면 확인이 늦어지므로 운영보다 짧게 잡는다.
    location /_next/static/ {
        proxy_pass http://hdg_web_dev;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        proxy_pass http://hdg_web_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        # SSR 스트리밍 응답을 버퍼링하면 첫 바이트가 늦어진다.
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }
}
