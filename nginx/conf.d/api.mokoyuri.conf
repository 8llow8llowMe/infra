# commerce-foundry(MOKOYURI) API 도메인 (#51) — api(운영) · api-dev(개발)
# - 지금은 인증서만 준비하고 경로를 모두 닫는다(404). 스토어프론트 · 어드민은 BFF 가 같은 docker 네트워크의 게이트웨이를 부르므로
#   브라우저가 API 도메인을 직접 쓸 일이 없다 — 게이트웨이를 외부에 열지 않는다(앱 레포 architecture-guide §6, #43 결정).
# - 토스페이먼츠 웹훅(앱 레포 #15)이 생기면 그 경로 하나만 location 으로 열고 게이트웨이로 보낸다. 그때 필요한 것:
#   · 게이트웨이 바인드(Vault API_GATEWAY_BIND_{DEV,PROD}) 를 호스트 사설 IP 로 — 기본은 루프백
#   · upstream: dev 192.168.0.13:2000, prod 192.168.0.9:1000

server {
    listen 80;
    server_name api.mokoyuri.shop api-dev.mokoyuri.shop;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.mokoyuri.shop;
    if ($scanner_probe) { return 444; }

    ssl_certificate /etc/letsencrypt/live/api.mokoyuri.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mokoyuri.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/commerce_api_access.json.log loki_json;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        default_type application/json;
        return 404 '{"message":"not found"}';
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-dev.mokoyuri.shop;
    if ($scanner_probe) { return 444; }

    ssl_certificate /etc/letsencrypt/live/api-dev.mokoyuri.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.mokoyuri.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/commerce_api_dev_access.json.log loki_json;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        default_type application/json;
        return 404 '{"message":"not found"}';
    }
}
