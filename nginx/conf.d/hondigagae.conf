# 혼디가개 운영 웹 라우팅 설정
# - hondigagae.com 요청은 https://www.hondigagae.com 으로 정규화
# - 운영 FE(hondigagae-frontend-web-prod)는 backend-server(192.168.0.9:5300)에 배포된다.
#   (dev FE는 main-server(192.168.0.11:7300) — dev.hondigagae.conf 참고)
#
# 포트 대역: 혼디가개는 dev 7xxx / prod 5xxx 를 쓴다.
#   BossPickSeoul 이 dev 6xxx / prod 9xxx 를 이미 점유해 같은 호스트에 올리면 충돌하기 때문이다.
#   (Infra README §4 배치 원칙 5번)
#
# 컨테이너명이 아니라 사설 IP로 전달하는 이유:
#   8llow8llowme-net 은 호스트별 브리지 네트워크라 storage(192.168.0.12)에서 도는 nginx 는
#   다른 호스트의 컨테이너명을 해석할 수 없다. API 라우팅(api.hondigagae.conf)도 같은 방식이다.
#
# 인증서는 발급되어 HTTPS 블록이 활성 상태다 (2026-10-10 확인).
# ⚠️ 인증서를 새로 발급해야 할 때(도메인 이전·삭제 후 복구)는 HTTPS 블록을 먼저 주석 처리해야 한다.
#    ssl_certificate 파일이 없으면 nginx 가 아예 기동하지 못하고,
#    이 nginx 는 전 도메인의 단일 인그레스라 다른 서비스까지 같이 내려간다.
#
#    적용 순서:
#      1) 이 파일을 conf.d 에 두고 (HTTPS 블록은 주석 유지) reload
#         docker exec nginx nginx -t && docker exec nginx nginx -s reload
#      2) 인증서 발급 (apex + www 를 한 인증서에 담는다)
#         cd ~/infra/certbot && ./init-cert-with-www.sh hondigagae.com
#      3) 아래 "HTTPS" 블록 주석을 풀고 다시 `nginx -t && nginx -s reload`

# 내부 대상: 호스트/포트가 바뀌면 여기 한 곳만 바꾸면 된다.
upstream hdg_web_prod {
    server 192.168.0.9:5300; # hondigagae-frontend-web-prod
}

server {
    listen 80;
    server_name hondigagae.com;

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # apex 도메인 HTTP 요청은 www HTTPS 주소로 전환
    location / {
        return 301 https://www.hondigagae.com$request_uri;
    }
}

server {
    listen 80;
    server_name www.hondigagae.com;

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # www 도메인 HTTP 요청은 동일 호스트의 HTTPS로 전환
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name hondigagae.com;

    ssl_certificate /etc/letsencrypt/live/hondigagae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hondigagae.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # apex HTTPS 요청도 최종적으로 www 도메인으로 정규화
    location / {
        return 301 https://www.hondigagae.com$request_uri;
    }
}
#
server {
    listen 443 ssl;
    http2 on;
    server_name www.hondigagae.com;

    ssl_certificate /etc/letsencrypt/live/hondigagae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hondigagae.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드(반려견 프로필 이미지)는 FE 를 거치지 않고 API 도메인으로 가지만,
    # Server Action 으로 파일을 넘기는 경로가 생길 수 있어 API 와 같은 상한을 둔다.
    client_max_body_size 30M;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/hondigagae_web_access.json.log loki_json;

    # 공통 proxy 헤더 (헤더를 재정의하지 않는 하위 location 이 상속)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js 빌드 산출 정적 자산은 콘텐츠 해시가 붙어 불변이다. Next 가 이미
    # "public, max-age=31536000, immutable" 을 주므로 add_header 를 두지 않는다 — 두면 같은 헤더가 두 줄 나간다.
    location /_next/static/ {
        proxy_pass http://hdg_web_prod;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://hdg_web_prod;
        # Next.js 는 HMR/Server Action 스트리밍에 keep-alive 업그레이드를 쓰므로 1.1 로 고정한다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        # SSR 스트리밍 응답을 버퍼링하면 첫 바이트가 늦어진다.
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }
}
