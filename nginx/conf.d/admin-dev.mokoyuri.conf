# commerce-foundry(MOKOYURI) 개발 어드민 라우팅 설정 (#43)
# - dev admin(commerce-admin-dev)는 backend-1(192.168.0.13:2301)에 배포된다. (#41 · README 8절)
# - 어드민은 스토어프론트와 다른 서브도메인에 둔다(앱 레포 #235). 쿠키가 스토어프론트와 섞이지 않는다.
# - 어드민 쿠키는 NODE_ENV=production 이라 Secure 다. HTTPS 가 열리기 전에는 로그인이 되지 않는다.
#
# ✅ 인증서 발급 완료(2026-11-01) — HTTPS 블록을 켰다. 아래는 같은 절차를 다른 도메인에 쓸 때의 참고다.
#      0) DNS: admin-dev.mokoyuri.shop A 레코드 → 공개 nginx 호스트
#      1) 이 파일을 conf.d 에 두고 reload
#      2) cd ~/infra/certbot && ./init-cert-non-www.sh admin-dev.mokoyuri.shop
#      3) HTTPS 블록 주석 해제 + HTTP 블록 301 전환 후 `nginx -t && nginx -s reload`

upstream cf_admin_dev {
    server 192.168.0.13:2301; # commerce-admin-dev
    # .12 → .13 연결 재사용(dev.mokoyuri.conf 와 같다)
    keepalive 16;
}

# 1. HTTP (Let's Encrypt HTTP-01 인증 경로 + 인증서 발급 후 HTTPS 강제 전환)
server {
    listen 80;
    server_name admin-dev.mokoyuri.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 인증서 발급 완료(2026-11-01) — HTTPS 로 보낸다.
    location / {
        return 301 https://admin-dev.mokoyuri.shop$request_uri;
    }
}

# 2. HTTPS 처리 (2026-11-01 인증서 발급 · 활성화)
server {
    listen 443 ssl;
    http2 on;
    server_name admin-dev.mokoyuri.shop;

    ssl_certificate /etc/letsencrypt/live/admin-dev.mokoyuri.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-dev.mokoyuri.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 상품 이미지 업로드(앱 레포 #9)를 어드민 BFF 가 받는다.
    client_max_body_size 30M;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/commerce_admin_dev_access.json.log loki_json;

    # 어드민은 검색엔진 색인을 막는다(dev · prod 모두).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # 접속 제한이 필요하면(앱 레포 #235) 아래 주석을 풀고 허용 대역을 적는다.
    # allow 192.168.0.0/24;
    # deny all;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 콘텐츠 해시가 붙은 불변 자산. Cache-Control 은 Next 의 immutable 을 그대로 쓰고(add_header 하면 두 줄),
    # nginx 디스크 캐시(cf_static)로 앱 호스트 왕복을 줄인다 — dev.mokoyuri.conf 와 같다
    location /_next/static/ {
        proxy_pass http://cf_admin_dev;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache cf_static;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        proxy_pass http://cf_admin_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cf_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }
}
