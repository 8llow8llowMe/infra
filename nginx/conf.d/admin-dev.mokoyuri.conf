# commerce-foundry(MOKOYURI) 개발 어드민 라우팅 설정 (#43)
# - dev admin(commerce-admin-dev)는 backend-1(192.168.0.13:2301)에 배포된다. (#41 · README 8절)
# - 어드민은 스토어프론트와 다른 서브도메인에 둔다(앱 레포 #235). 쿠키가 스토어프론트와 섞이지 않는다.
# - 어드민 쿠키는 NODE_ENV=production 이라 Secure 다. HTTPS 가 열리기 전에는 로그인이 되지 않는다.
#
# ⚠️ HTTPS 블록은 인증서 발급 전이라 주석 처리해 두었다. (dev.mokoyuri.conf 와 같은 이유 · 같은 순서)
#      0) DNS: admin-dev.mokoyuri.com A 레코드 → 공개 nginx 호스트
#      1) 이 파일을 conf.d 에 두고 reload
#      2) cd ~/infra/certbot && ./init-cert-non-www.sh admin-dev.mokoyuri.com
#      3) HTTPS 블록 주석 해제 + HTTP 블록 301 전환 후 `nginx -t && nginx -s reload`

upstream cf_admin_dev {
    server 192.168.0.13:2301; # commerce-admin-dev
}

# 1. HTTP (Let's Encrypt HTTP-01 인증 경로 + 인증서 발급 후 HTTPS 강제 전환)
server {
    listen 80;
    server_name admin-dev.mokoyuri.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 인증서 발급 전: 404. 발급 후: 아래 줄을 지우고 301 줄의 주석을 푼다.
    location / {
        return 404;
        # return 301 https://admin-dev.mokoyuri.com$request_uri;
    }
}

