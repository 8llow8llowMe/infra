# Kafka UI(kafbat) 도메인 설정
# - 모든 HTTP 요청은 HTTPS로 전환
# - www 도메인은 non-www 도메인으로 정규화
# - Kafka UI 백엔드는 ollama/vault 서버(192.168.0.10:18080)로 전달
#
# 인증은 Kafka UI 자체 로그인 폼(AUTH_TYPE=LOGIN_FORM)이 담당합니다.
# 계정은 kafka/.env 의 KAFKA_UI_AUTH_USERNAME / KAFKA_UI_AUTH_PASSWORD 로 설정하며,
# 비어 있으면 install-kafka.sh 가 기동을 막습니다.
#
# nginx basic auth 를 여기에 두지 않는 이유:
# - Kafka UI 는 호스트 포트(18080)로도 열려 있어 nginx basic auth 로는 그 경로를 막지 못합니다.
#   애플리케이션 계층 인증이 두 경로를 모두 덮으므로 그쪽이 실질적인 방어선입니다.
# - 둘을 함께 걸면 비밀번호를 두 번 입력하게 되어, 결국 한쪽을 끄게 됩니다.

# Kafka UI HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name kafka-ui.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    # Let's Encrypt 인증서 발급용 challenge 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kafka-ui.8llow8llowme.com$request_uri;
    }
}

# Kafka UI www HTTP -> non-www HTTPS 리다이렉트
server {
    listen 80;
    server_name www.kafka-ui.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    # Let's Encrypt 인증서 발급용 challenge 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kafka-ui.8llow8llowme.com$request_uri;
    }
}

# Kafka UI www HTTPS -> non-www HTTPS 리다이렉트
server {
    listen 443 ssl;
    server_name www.kafka-ui.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/kafka-ui.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kafka-ui.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://kafka-ui.8llow8llowme.com$request_uri;
    }
}

# Kafka UI 실제 백엔드 연결
server {
    listen 443 ssl;
    server_name kafka-ui.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/kafka-ui.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kafka-ui.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 관리 UI 는 검색엔진에 노출할 이유가 없다.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 메시지 produce 등에 쓰는 요청 본문 크기
    client_max_body_size 20M;

    location / {
        # 로그인 폼 인증 위에 접근 범위까지 좁히고 싶으면 아래 주석을 푼다.
        # 외부에서 접속할 일이 없다면 켜두는 편이 안전하다.
        #allow 192.168.0.0/24;
        #deny all;

        proxy_pass http://192.168.0.10:18080;
        proxy_http_version 1.1;

        # 원본 요청 정보를 Kafka UI 에 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # 토픽 메시지 실시간 조회(SSE/WebSocket) 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 대용량 토픽 조회가 오래 걸릴 수 있어 여유를 둔다.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
