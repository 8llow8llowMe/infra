# Grafana 도메인 설정
# - 모든 HTTP 요청은 HTTPS로 전환
# - www 도메인은 non-www 정규 도메인으로 정리
# - Grafana Live(WebSocket) 연결을 지원

# 1. Grafana HTTP -> HTTPS
server {
    listen 80;
    server_name grafana.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://grafana.8llow8llowme.com$request_uri;
    }
}

# 2. www 도메인 정규화
server {
    listen 80;
    server_name www.grafana.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://grafana.8llow8llowme.com$request_uri;
    }
}

# 3. www HTTPS 정규화
server {
    listen 443 ssl;
    server_name www.grafana.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/grafana.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://grafana.8llow8llowme.com$request_uri;
    }
}

# 4. Grafana 실제 백엔드 연결
server {
    listen 443 ssl;
    server_name grafana.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/grafana.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://192.168.0.14:3001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Grafana Live(WebSocket) 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

