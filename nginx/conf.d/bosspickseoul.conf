# BossPickSeoul 운영 웹 라우팅 설정
# - bosspickseoul.com 요청은 https://www.bosspickseoul.com 으로 정규화
# - 운영 FE(bosspickseoul-frontend-web-prod)는 backend-1(192.168.0.13:9300)에 배포된다.
#   (dev FE는 main-server(192.168.0.11:6300) — dev.bosspickseoul.conf 참고)
#
# 컨테이너명이 아니라 사설 IP로 전달하는 이유:
#   8llow8llowme-net 은 호스트별 브리지 네트워크라 storage(192.168.0.12)에서 도는 nginx 는
#   다른 호스트의 컨테이너명을 해석할 수 없다. API 라우팅(api.bosspickseoul.conf)도 같은 방식이다.
#   과거 web-ssr:3000 으로 프록시하던 시절에는 같은 호스트의 tripmarble 컨테이너가 응답하는
#   사고가 있었으므로, 공유 컨테이너명으로는 절대 되돌리지 않는다.

# 내부 대상: 호스트/포트가 바뀌면 여기 한 곳만 바꾸면 된다.
upstream bps_web_prod {
    server 192.168.0.13:9300; # bosspickseoul-frontend-web-prod
}

server {
    listen 80;
    server_name bosspickseoul.com;

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # apex 도메인 HTTP 요청은 www HTTPS 주소로 전환
    location / {
        return 301 https://www.bosspickseoul.com$request_uri;
    }
}

server {
    listen 80;
    server_name www.bosspickseoul.com;

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # www 도메인 HTTP 요청은 동일 호스트의 HTTPS로 전환
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bosspickseoul.com;

    ssl_certificate /etc/letsencrypt/live/bosspickseoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosspickseoul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # apex HTTPS 요청도 최종적으로 www 도메인으로 정규화
    location / {
        return 301 https://www.bosspickseoul.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.bosspickseoul.com;

    ssl_certificate /etc/letsencrypt/live/bosspickseoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosspickseoul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드(프로필 이미지, 커뮤니티 첨부)는 FE 를 거치지 않고 API 도메인으로 가지만,
    # Server Action 으로 파일을 넘기는 경로가 생길 수 있어 API 와 같은 상한을 둔다.
    client_max_body_size 150M;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/bosspickseoul_web_access.json.log loki_json;

    # 공통 proxy 헤더 (헤더를 재정의하지 않는 하위 location 이 상속)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js 빌드 산출 정적 자산은 콘텐츠 해시가 붙어 불변이므로 브라우저에 길게 캐시시킨다.
    location /_next/static/ {
        proxy_pass http://bps_web_prod;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://bps_web_prod;
        # Next.js 는 HMR/Server Action 스트리밍에 keep-alive 업그레이드를 쓰므로 1.1 로 고정한다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        # SSR 스트리밍 응답을 버퍼링하면 첫 바이트가 늦어진다.
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }
}
