# Vault Web UI 도메인 설정
# - 모든 HTTP 요청은 HTTPS로 전환
# - www 도메인은 non-www 도메인으로 정규화
# - Vault 백엔드는 ollama/vault 서버(192.168.0.10:8200)로 전달

# Vault HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name vault.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    # Let's Encrypt 인증서 발급용 challenge 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vault.8llow8llowme.com$request_uri;
    }
}

# Vault www HTTP -> non-www HTTPS 리다이렉트
server {
    listen 80;
    server_name www.vault.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    # Let's Encrypt 인증서 발급용 challenge 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vault.8llow8llowme.com$request_uri;
    }
}

# Vault www HTTPS -> non-www HTTPS 리다이렉트
server {
    listen 443 ssl;
    server_name www.vault.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/vault.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://vault.8llow8llowme.com$request_uri;
    }
}

# Vault Web UI 실제 백엔드 연결
server {
    listen 443 ssl;
    server_name vault.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/vault.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Vault UI/API 요청 허용 크기
    client_max_body_size 20M;

    location / {
        proxy_pass http://192.168.0.10:8200;
        proxy_http_version 1.1;

        # 원본 요청 정보를 Vault에 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # UI/API 응답을 실시간으로 전달
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
