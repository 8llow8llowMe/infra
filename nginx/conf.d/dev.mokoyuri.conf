# commerce-foundry(MOKOYURI) 개발 스토어프론트 라우팅 설정 (#43)
# - dev storefront(commerce-storefront-dev)는 backend-1(192.168.0.13:2300)에 배포된다. (#41 · README 8절)
# - 영문 스토어는 같은 호스트의 /en 경로다(앱의 경로 방식 i18n — LOCALE_HOSTS 를 비운다).
# - API 도메인은 따로 열지 않는다. storefront 가 BFF(route handler)로 같은 docker 네트워크의 게이트웨이를 부른다.
# - mokoyuri.com 본 사이트는 카페24 에서 운영 중이다. 이전 전까지는 이 서브도메인만 이 nginx 로 온다.
#
# ⚠️ HTTPS 블록은 인증서 발급 전이라 주석 처리해 두었다.
#    ssl_certificate 파일이 없으면 nginx 가 아예 기동하지 못하고,
#    이 nginx 는 전 도메인의 단일 인그레스라 다른 서비스까지 같이 내려간다.
#
#    적용 순서:
#      0) DNS: dev.mokoyuri.com A 레코드 → 공개 nginx 호스트 (카페24 DNS 관리, 와일드카드보다 우선)
#      1) 이 파일을 conf.d 에 두고 (HTTPS 블록은 주석 유지) reload
#         docker exec nginx nginx -t && docker exec nginx nginx -s reload
#         (아래 HTTP 블록이 HTTP-01 챌린지 경로를 열어주므로 bootstrap conf 는 따로 만들지 않는다)
#      2) 인증서 발급
#         cd ~/infra/certbot && ./init-cert-non-www.sh dev.mokoyuri.com
#      3) 아래 "HTTPS" 블록 주석을 풀고, HTTP 블록의 location / 를 301 로 바꾼 뒤 다시 `nginx -t && nginx -s reload`

# 내부 대상: 호스트/포트가 바뀌면 여기 한 곳만 바꾸면 된다.
upstream cf_storefront_dev {
    server 192.168.0.13:2300; # commerce-storefront-dev
}

# 1. HTTP (Let's Encrypt HTTP-01 인증 경로 + 인증서 발급 후 HTTPS 강제 전환)
server {
    listen 80;
    server_name dev.mokoyuri.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 인증서 발급 전: 아직 HTTPS 가 없으므로 404 로 둔다(평문으로 서비스하지 않는다).
    # 인증서 발급 후: 아래 줄을 지우고 301 줄의 주석을 푼다.
    location / {
        return 404;
        # return 301 https://dev.mokoyuri.com$request_uri;
    }
}

