# commerce-foundry(MOKOYURI) 운영 스토어프론트 라우팅 설정 (#51)
# - 대표 주소는 apex(https://mokoyuri.shop)다. www 는 apex 로 301 한다. 인증서 하나가 둘을 담는다(init-cert-with-www.sh).
# - 영문 스토어는 같은 호스트의 /en 경로다(앱의 경로 방식 i18n).
# - prod storefront(commerce-storefront-prod)는 backend-server(192.168.0.9:1300)에 배포된다(README 8절).
#   그 호스트의 게시 포트는 루프백이 기본이라 배포 때 Vault 에 STOREFRONT_BIND_PROD=192.168.0.9 를 넣어야 이 nginx 가 닿는다.
# - 운영 배포 전(운영 DB 준비 전)에는 upstream 이 없어 502 가 난다. 그 동안은 점검 안내(503)를 보여 주고,
#   배포되면 별도 작업 없이 실제 응답으로 넘어간다(@cf_maintenance).
# - mokoyuri.shop 은 임시 도메인이다. mokoyuri.com 으로 이관할 때 server_name · 인증서 경로만 바꾼다.

upstream cf_storefront_prod {
    server 192.168.0.9:1300; # commerce-storefront-prod
    keepalive 16;
}

# 1. HTTP — Let's Encrypt HTTP-01 챌린지 + HTTPS 대표 주소로 전환
server {
    listen 80;
    server_name mokoyuri.shop www.mokoyuri.shop;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mokoyuri.shop$request_uri;
    }
}

# 2. HTTPS www → apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.mokoyuri.shop;
    if ($scanner_probe) { return 444; }

    ssl_certificate /etc/letsencrypt/live/mokoyuri.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mokoyuri.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://mokoyuri.shop$request_uri;
    }
}

# 3. HTTPS 대표 주소
server {
    listen 443 ssl;
    http2 on;
    server_name mokoyuri.shop;
    if ($scanner_probe) { return 444; }

    ssl_certificate /etc/letsencrypt/live/mokoyuri.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mokoyuri.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/commerce_storefront_access.json.log loki_json;

    # 공통 proxy 헤더 (헤더를 재정의하지 않는 하위 location 이 상속)
    # - X-Real-IP 는 클라이언트가 보낸 값을 덮어쓴다. 앱의 CLIENT_IP_HEADER=x-real-ip 가 이 값을 읽는다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 앱 호스트에 닿지 못할 때(배포 전 · 재기동 중)만 점검 안내로 바꾼다. 앱이 직접 낸 5xx 는 그대로 둔다(proxy_intercept_errors off).
    error_page 502 504 = @cf_maintenance;

    # 콘텐츠 해시가 붙은 불변 자산. Cache-Control 은 Next 의 immutable 그대로(add_header 하면 두 줄), nginx 디스크 캐시로 앱 왕복을 줄인다.
    location /_next/static/ {
        proxy_pass http://cf_storefront_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache cf_static;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://cf_storefront_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cf_connection_upgrade;
        # SSR 스트리밍 응답을 버퍼링하면 첫 바이트가 늦어진다.
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }

    location @cf_maintenance {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
        add_header X-Robots-Tag "noindex" always;
        return 503 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOKOYURI</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#faf8f5;color:#2b2622;text-align:center}h1{font-weight:500;letter-spacing:.2em;margin:0 0 16px}p{margin:4px 0;color:#6b625b}</style></head><body><main><h1>MOKOYURI</h1><p>새 쇼핑몰을 준비하고 있습니다. 곧 찾아뵙겠습니다.</p><p>Our new store is coming soon.</p></main></body></html>';
    }
}
