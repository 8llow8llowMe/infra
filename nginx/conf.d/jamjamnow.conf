# jamjamnow 서비스 설정
# - 정적 자산은 MinIO에서 제공
# - /api 경로는 백엔드 애플리케이션으로 전달

server {
    listen 80;
    server_name www.jamjamnow.com;

    # 1. 도메인 전용 액세스 로그
    access_log /var/log/nginx/jamjamnow_web_access.json.log loki_json;

    # 2. 메인 HTML은 캐시를 비활성화해 배포 반영을 빠르게 합니다.
    location = /index.html {
        proxy_pass http://minio:9000/www.jamjamnow.com/index.html;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 3. 정적 파일은 MinIO 버킷 경로로 프록시합니다.
    location / {
        proxy_pass http://minio:9000/www.jamjamnow.com/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. API 요청은 애플리케이션 백엔드로 전달합니다.
    location /api {
        proxy_pass http://jamjamnow-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
