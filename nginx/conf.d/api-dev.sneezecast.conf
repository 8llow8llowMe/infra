# sneezecast 개발 API 라우팅 설정
# 아키텍처:
#   - 모든 REST 는 api-gateway 경유로 호출한다. auth-service 직결 라우트를 두지 않는다.
#   - Swagger 집계 라우트를 두지 않는다. (api-gateway 에 아직 Swagger 집계가 없다 - 생기면 그때 추가)
# 공통 proxy 헤더는 server 레벨에서 정의하고, 헤더를 새로 지정하지 않는 location은 이를 상속한다.
#
# BossPickSeoul·혼디가개와 다른 점 — auth-service 직결("단독") 라우트가 없다:
#   그쪽 conf 는 /api/v1/auth, /api/v1/members, /auth-service/ 를 게이트웨이 없이 auth 포트로 보낸다.
#   sneezecast 는 "서비스 포트를 외부에 노출하지 않는다" 를 배포 전제로 둔다.
#     1) 서비스(auth 포함)의 actuator(health, info, prometheus)가 인증 없이 열려 있다.
#        직결 location 이 하나라도 생기면 그 포트가 공개망에 닿는다.
#     2) access token 블랙리스트 확인, 클라이언트가 보낸 회원 헤더 제거, 업스트림 타임아웃은
#        게이트웨이가 맡는다. 직결하면 이 검사들을 건너뛴다.
#   같은 이유로 혼디가개의 /api-gateway/ prefix 직결도 두지 않는다 (게이트웨이 actuator 까지 열린다).
#   공개 경로는 전부 /api/v1/ 아래이고 게이트웨이 라우트가 서비스로 나눈다.
#
# 포트 대역: sneezecast dev 는 3xxx 다. (prod 4xxx, 같은 끝자리)
#
# ⚠️ 인증서 발급 전에는 아래 HTTPS 블록이 주석 처리되어 있어야 한다.
#    인증서 파일이 없는데 ssl_certificate 를 걸면 nginx -t 가 실패하고, 이 nginx 는 전 도메인의
#    단일 인그레스라 다른 프로젝트 도메인까지 함께 내려간다.
#    적용 순서:
#      0) api-dev.sneezecast.com A 레코드가 공개 Nginx 호스트를 가리키는지 확인
#      1) HTTPS 블록 주석 유지한 채 reload
#      2) cd ~/infra/certbot && ./init-cert-non-www.sh api-dev.sneezecast.com
#      3) HTTPS 블록 주석 해제 후 `nginx -t && nginx -s reload`

# 내부 대상: 호스트/포트가 바뀌면 여기 한 곳만 바꾸면 된다.
# dev 백엔드는 backend-1(192.168.0.13, dev 서버 2)에 배포된다.
# (prod 백엔드는 신규 미니PC - IP 가 정해지면 api.sneezecast.conf 를 만든다)
upstream snc_gateway_dev {
    server 192.168.0.13:3000; # api-gateway-dev (유일한 프록시 대상)
}

# 1. HTTP -> HTTPS 강제 전환
server {
    listen 80;
    server_name api-dev.sneezecast.com;

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api-dev.sneezecast.com$request_uri;
    }
}

