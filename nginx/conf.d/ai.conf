# Open WebUI 도메인 설정
# - 모든 HTTP 요청을 HTTPS로 전환
# - ai.8llow8llowme.com에서 Open WebUI를 제공
# - 사설망의 Open WebUI 호스트로 프록시

# 1. Open WebUI HTTP -> HTTPS 전환
server {
    listen 80;
    server_name ai.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ai.8llow8llowme.com$request_uri;
    }
}

# 2. Open WebUI 실제 백엔드 연결
server {
    listen 443 ssl;
    server_name ai.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/ai.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://192.168.0.10:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 업그레이드 및 스트리밍 응답 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}

