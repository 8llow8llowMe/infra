# 8. MinIO 콘솔 실제 백엔드 연결
server {
    listen 443 ssl;
    server_name console.minio.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/console.minio.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.minio.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;

        # Web UI 실시간 연결 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
