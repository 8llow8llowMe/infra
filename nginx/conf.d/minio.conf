# MinIO 도메인 설정
# - API/버킷 접근 도메인과 콘솔 도메인을 분리 운영
# - 모든 HTTP 요청은 HTTPS로 전환
# - www 도메인은 non-www 정규 도메인으로 정리

# 1. MinIO API/버킷 HTTP -> HTTPS
server {
    listen 80;
    server_name minio.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://minio.8llow8llowme.com$request_uri;
    }
}

# 2. API www 도메인 정규화
server {
    listen 80;
    server_name www.minio.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://minio.8llow8llowme.com$request_uri;
    }
}

# 3. API www HTTPS 정규화
server {
    listen 443 ssl;
    server_name www.minio.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/minio.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://minio.8llow8llowme.com$request_uri;
    }
}

# 4. MinIO API/버킷 실제 백엔드 연결
server {
    listen 443 ssl;
    server_name minio.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/minio.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 브라우저 기반 객체 조회를 위한 CORS 헤더
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, User-Agent, Referer" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Type, Last-Modified" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, User-Agent, Referer";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
    }
}

