# Jenkins 도메인 설정
# - API/Webhook 도메인과 Web UI 도메인을 분리 운영
# - 모든 HTTP 요청은 HTTPS로 전환
# - www 도메인은 non-www 정규 도메인으로 정리

# 1. Jenkins API 도메인 HTTP -> HTTPS
server {
    listen 80;
    server_name jenkins.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jenkins.8llow8llowme.com$request_uri;
    }
}

# 2. API www 도메인 정규화
server {
    listen 80;
    server_name www.jenkins.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jenkins.8llow8llowme.com$request_uri;
    }
}

# 3. API www HTTPS 정규화
server {
    listen 443 ssl;
    server_name www.jenkins.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/jenkins.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://jenkins.8llow8llowme.com$request_uri;
    }
}

# 4. Jenkins API/Webhook 실제 백엔드 연결
server {
    listen 443 ssl;
    server_name jenkins.8llow8llowme.com;
    if ($scanner_probe) { return 444; }  # 스캐너 경로는 응답 없이 끊는다 (#37, nginx.conf map)

    ssl_certificate /etc/letsencrypt/live/jenkins.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://192.168.0.10:49999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # Jenkins 실시간 연결(WebSocket) 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

