[Definition]
# trading.8llow8llowme.com 로그인 실패 (access.log, main 포맷) (#68)
# 앱(trading-desk)은 틀린 아이디 · 비밀번호에 401, 앱 자체 시도 제한에 429 를 준다. 둘 다 센다.
# 로그인 경로만 본다 — 세션 만료로 다른 /api/ 경로가 내는 401 은 정상 사용자도 낸다.
#
# main 포맷: $server_name $scheme $remote_addr - $remote_user [$time_local] "$request" $status ...
failregex = ^trading\.8llow8llowme\.com \S+ <HOST> - \S+ \[[^\]]*\] "POST /api/auth/login(?:\?[^ "]*)? HTTP/[0-9.]+" (?:401|429) 
ignoreregex =
