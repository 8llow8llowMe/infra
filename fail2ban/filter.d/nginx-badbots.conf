[Definition]
# 공격 도구 User-Agent 탐지 (access.log, main 포맷) (#37)
# 취약점 · 포트 · 디렉터리 스캐너만 봅니다. 정상 트래픽이 쓰는 UA 는 넣지 않습니다.
# - bot · spider · crawler: Googlebot · Bingbot · Meta · OpenAI 크롤러까지 걸려 예전에 같이 막혔습니다.
# - curl · wget · python-requests · httpx: 헬스체크 · 웹훅 · 개발자 호출도 씁니다.
#
# main 포맷 끝: ... $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"
# nginx 는 값 안의 " 를 \x22 로 적으므로 [^"]* 가 필드를 넘지 않습니다.
failregex = ^\S+ \S+ <HOST> - \S+ \[[^\]]*\] "[^"]*" \d{3} \d+ "[^"]*" "[^"]*(?i:sqlmap|nikto|nuclei|nmap|masscan|zgrab|wpscan|dirbuster|gobuster|feroxbuster|ffuf|acunetix|nessus|openvas|netsparker|w3af|fimap|whatweb|morfeus|zmeu|jorgee|l9explore|l9tcpid|commix)[^"]*" "[^"]*"$
ignoreregex =
