[Definition]
# 스캐너 경로 탐지 (access.log, main 포맷) (#37)
# nginx.conf 의 map $scanner_probe 가 .env · .git · *.php · wp-* 같은 경로를 444 로 끊습니다.
# 444 는 이 규칙만 돌려주므로 상태 코드 444 하나로 판정합니다. 경로 목록은 nginx.conf 한 곳에서만 고칩니다.
#
# main 포맷: $server_name $scheme $remote_addr - $remote_user [$time_local] "$request" $status ...
failregex = ^\S+ \S+ <HOST> - \S+ \[[^\]]*\] "[^"]*" 444\s
ignoreregex =
