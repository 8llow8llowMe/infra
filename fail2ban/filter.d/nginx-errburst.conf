[Definition]
# 짧은 시간 404/400/405 다발 탐지 (access.log, main 포맷) (#37)
# - 401 · 403 은 세지 않습니다. 토큰이 만료된 사용자의 API 재시도가 연달아 나기 때문입니다.
# - 444 는 nginx-scanner 가 따로 셉니다.
# - /api/ (앱의 비즈니스 404) 와 /_next/ (배포 직후 옛 청크 요청) 는 ignoreregex 로 뺍니다.
failregex = ^\S+ \S+ <HOST> - \S+ \[[^\]]*\] "[^"]*" (?:400|404|405)\s
ignoreregex = ^\S+ \S+ \S+ - \S+ \[[^\]]*\] "[A-Z]+ /(?:api|_next)/
