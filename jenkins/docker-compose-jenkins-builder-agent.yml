name: ${JENKINS_BUILDER_PROJECT_NAME:-jenkins-builder-agent}

services:
  jenkins-builder-agent:
    image: ${JENKINS_BUILDER_IMAGE:-jenkins-builder-agent:latest}
    container_name: ${JENKINS_BUILDER_CONTAINER_NAME:-jenkins-builder-agent}
    restart: unless-stopped
    mem_limit: ${JENKINS_BUILDER_MEM_LIMIT:-3g}
    memswap_limit: ${JENKINS_BUILDER_MEM_LIMIT:-3g}
    cpus: ${JENKINS_BUILDER_CPUS:-4.0}
    pids_limit: ${JENKINS_BUILDER_PIDS_LIMIT:-1024}
    oom_score_adj: 500
    build:
      context: .
      dockerfile: jenkins-builder-agent.Dockerfile
    environment:
      JENKINS_URL: ${JENKINS_URL}
      JENKINS_AGENT_NAME: ${JENKINS_BUILDER_NAME}
      JENKINS_AGENT_SECRET: ${JENKINS_BUILDER_SECRET}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      JENKINS_AGENT_CACHE_PROFILE: builder
      GRADLE_OPTS: ${JENKINS_BUILDER_GRADLE_OPTS:--Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false}
      TZ: ${TZ}
    volumes:
      - ${JENKINS_BUILDER_WORKDIR:-./jenkins-builder-agent}:/home/jenkins/agent
      - jenkins-builder-agent-gradle:/home/jenkins/.gradle
      - jenkins-builder-agent-npm:/home/jenkins/.npm
      - jenkins-builder-agent-pnpm:/home/jenkins/.local/share/pnpm
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  jenkins-builder-agent-gradle:
  jenkins-builder-agent-npm:
  jenkins-builder-agent-pnpm:
