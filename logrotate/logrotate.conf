# Nginx 로그 로테이션 설정
# - 공용 access/error 로그와 프로젝트별 access 로그를 함께 관리
# - 로그 회전 후 nginx reopen 명령으로 새 파일에 다시 기록

nocompress
missingok
create 0640 root root

/var/log/nginx/access.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 14
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}

# 프로젝트별 JSON access 로그 (#35). promtail(storage)이 Loki 로 보내므로 호스트에는 7일만 둡니다.
# 파일명 규칙: <project>_<site>[_dev]_access.json.log  (site = api | web)
# 회전된 파일(-YYYYMMDD)은 promtail 의 *_access.json.log 글롭에 걸리지 않습니다.
/var/log/nginx/*_access.json.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 7
    notifempty
    create 0644 root root
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}

# #35 이전의 프로젝트별 main 포맷 로그. 더 이상 쓰이지 않으며 회전 1번 뒤 7일이 지나면 사라집니다.
# (access.log 는 "_" 로 시작하지 않아 이 글롭에 걸리지 않습니다)
/var/log/nginx/*_access.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 7
    notifempty
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}

/var/log/nginx/error.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 14
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}
