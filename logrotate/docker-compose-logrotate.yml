services:
  logrotate:
    container_name: logrotate
    restart: always
    build:
      context: .
      dockerfile: logrotate.Dockerfile
    volumes:
      # Nginx 로그 파일 공유 (로테이션 대상)
      - ../nginx/logs:/var/log/nginx
      - ../fail2ban/logs:/var/log/fail2ban # fail2ban.log (#37)
      # nginx 컨테이너 제어 (reopen 명령)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Seoul
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
