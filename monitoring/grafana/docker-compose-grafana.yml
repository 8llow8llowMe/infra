services:
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: ${GRAFANA_CONTAINER_NAME}
    restart: unless-stopped
    # 2GB 호스트에서 한 컨테이너가 폭주해도 나머지가 살아남도록 상한을 둡니다. 값은 .env 로 조정합니다.
    mem_limit: ${GRAFANA_MEM_LIMIT:-320m}
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # 프로비저닝된 BossPickSeoul 백엔드 개요를 기본 홈 화면으로 사용합니다.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/BossPickSeoul/01-backend-overview.json
      # 동적 대시보드(탭/auto-grid, v2 스키마)를 쓰려면 아래 토글을 켭니다.
      # 현재 대시보드는 안정적인 classic 스키마이므로 기본은 비활성입니다.
      # GF_FEATURE_TOGGLES_ENABLE: 'kubernetesDashboards,dashboardNewLayouts'
      TZ: ${TZ}
    ports:
      - '${GRAFANA_PORT}:3000'
    volumes:
      # Grafana 데이터와 datasource provisioning 설정을 분리해 관리합니다.
      - ./grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
