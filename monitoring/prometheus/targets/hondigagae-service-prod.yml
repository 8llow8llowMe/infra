# 혼디가개 service prod. prod 는 backend-server(.9) 5xxx — 포트 정본은 애플리케이션 레포 backend/docs/deploy-guide.md

- targets:
    - 192.168.0.9:5081
  labels:
    project: hondigagae
    service_group: service
    env: prod
    host: backend-server
    service: auth-service
    container: hondigagae-auth-service-prod
    deployment: hondigagae-auth-service-prod

