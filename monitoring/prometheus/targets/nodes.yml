# 192.168.0.10에서 node_exporter를 실행한 뒤 UP 상태를 확인한다.
- labels:
    host: ollama-01
    role: infra
    project: infra
  targets:
    - 192.168.0.10:9100
- labels:
    host: backend-1
    role: backend
    project: bosspickseoul
  targets:
    - 192.168.0.13:9100
