services:
  promtail:
    image: ${PROMTAIL_IMAGE}
    container_name: ${PROMTAIL_CONTAINER_NAME}
    restart: unless-stopped
    # 앱 서버의 메모리를 에이전트가 잠식하지 않도록 상한을 둡니다.
    mem_limit: ${PROMTAIL_MEM_LIMIT:-192m}
    # 환경변수 기반 Loki push URL과 host/project 라벨을 promtail.yml에 주입합니다.
    command:
      - -config.file=/etc/promtail/promtail.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL}
      PROMTAIL_HOSTNAME: ${PROMTAIL_HOSTNAME}
      PROMTAIL_PROJECT: ${PROMTAIL_PROJECT}
      TZ: ${TZ}
    volumes:
      # Docker socket을 읽어 컨테이너 로그와 라벨을 자동 탐색합니다.
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - ./promtail-data:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
