services:
  promtail:
    image: ${PROMTAIL_IMAGE}
    container_name: ${PROMTAIL_CONTAINER_NAME}
    restart: unless-stopped
    # 2GB 호스트에서 한 컨테이너가 폭주해도 나머지가 살아남도록 상한을 둡니다. 값은 .env 로 조정합니다.
    mem_limit: ${PROMTAIL_MEM_LIMIT:-192m}
    depends_on:
      - loki
    command:
      - -config.file=/etc/promtail/promtail.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: ${MONITORING_PROMTAIL_LOKI_PUSH_URL}
      PROMTAIL_HOSTNAME: ${MONITORING_PROMTAIL_HOSTNAME}
      PROMTAIL_PROJECT: ${MONITORING_PROMTAIL_PROJECT}
      TZ: ${TZ}
    volumes:
      # Docker socket을 읽어 컨테이너 로그와 라벨을 자동 탐색합니다.
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./promtail-data:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
