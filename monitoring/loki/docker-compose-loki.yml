services:
  loki:
    image: ${LOKI_IMAGE}
    container_name: ${LOKI_CONTAINER_NAME}
    restart: unless-stopped
    # 2GB 호스트에서 한 컨테이너가 폭주해도 나머지가 살아남도록 상한을 둡니다. 값은 .env 로 조정합니다.
    mem_limit: ${LOKI_MEM_LIMIT:-384m}
    # 환경변수 기반 retention 값을 loki.yml에 주입합니다.
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD}
      TZ: ${TZ}
    ports:
      - '${LOKI_PORT}:3100'
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki-data:/loki
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
