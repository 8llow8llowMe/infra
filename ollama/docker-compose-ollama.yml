services:
  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: ${OLLAMA_CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEM_LIMIT:-17g}
    memswap_limit: ${OLLAMA_MEM_LIMIT:-17g}
    cpus: ${OLLAMA_CPUS:-8.0}
    # 호스트의 DRI 장치를 컨테이너에 전달해 Ollama가 AMD iGPU를 Vulkan으로 사용할 수 있게 합니다.
    # 컨테이너 안에서도 /dev/dri/renderD128 같은 GPU 렌더 장치가 보이게 됩니다.
    devices:
      - '${AMD_GPU_DRI_DEVICE}:${AMD_GPU_DRI_DEVICE}'
    # /dev/dri/renderD128 접근 권한을 위해 호스트의 render 그룹 GID를 컨테이너에 추가합니다.
    # 이 값이 없으면 장치는 보여도 permission denied 때문에 GPU 사용에 실패할 수 있습니다.
    group_add:
      - '${AMD_GPU_RENDER_GROUP}'
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-16}
      OLLAMA_VULKAN: ${OLLAMA_VULKAN}
      # Ollama 0.32+부터 내장 GPU(iGPU)는 기본 제외된다. 이 플래그가 없으면
      # "dropping integrated GPU" 로그와 함께 CPU 추론으로 떨어진다.
      OLLAMA_IGPU_ENABLE: ${OLLAMA_IGPU_ENABLE}
      # flash attention + KV 캐시 8bit 양자화: KV 캐시 메모리를 절반으로 줄여
      # 긴 프롬프트(AI 리포트 원천 데이터) 처리 시 대역폭 부담을 낮춘다.
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE}
      TZ: ${TZ}
    ports:
      - '${OLLAMA_PORT}:${OLLAMA_CONTAINER_PORT}'
    volumes:
      - '${OLLAMA_DATA_DIR}:${OLLAMA_CONTAINER_DATA_DIR}'
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  open-webui:
    image: ${OPEN_WEBUI_IMAGE}
    container_name: ${OPEN_WEBUI_CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: ${OPEN_WEBUI_MEM_LIMIT:-1g}
    memswap_limit: ${OPEN_WEBUI_MEM_LIMIT:-1g}
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: ${OPEN_WEBUI_OLLAMA_BASE_URL}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      TZ: ${TZ}
    ports:
      - '${OPEN_WEBUI_PORT}:${OPEN_WEBUI_CONTAINER_PORT}'
    volumes:
      - '${OPEN_WEBUI_DATA_DIR}:${OPEN_WEBUI_CONTAINER_DATA_DIR}'
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
