# Redis Sentinel 설정 파일
# - 환경변수로 비밀번호를 안전하게 주입받는 버전
# - redis-sentinel 컨테이너가 실행 시점에 envsubst로 실제 파일 생성

# Sentinel이 사용할 포트
port 26379

# 다른 Sentinel 과 클라이언트에게 알릴 주소 — 호스트 IP (호스트별 .env 의 REDIS_ANNOUNCE_IP)
# 컨테이너가 Docker bridge 안에 있어 지정하지 않으면 컨테이너 IP(172.18.x)를 알려 서로를 찾지 못한다.
sentinel announce-ip ${REDIS_ANNOUNCE_IP}
sentinel announce-port 26379

# Sentinel 실행 디렉터리 (임시 상태 파일 저장)
dir /tmp

# 감시 대상 Redis Master 등록
# 형식: sentinel monitor <이름> <host> <port> <quorum>
sentinel monitor master-redis 192.168.0.11 6379 2

# Master 응답이 없다고 판단하기까지의 시간 (ms)
sentinel down-after-milliseconds master-redis 5000

# Failover 진행 후 Slave가 새 Master를 복제하기 위한 최대 시간
sentinel failover-timeout master-redis 10000

# Failover 시 병렬로 동기화할 Slave 수
sentinel parallel-syncs master-redis 1

# 인증 비밀번호를 환경변수로 주입
# 환경변수가 비어있다면 Redis는 비밀번호 인증을 요구하지 않음
sentinel auth-pass master-redis ${REDIS_MASTER_PASSWORD}