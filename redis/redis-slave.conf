# Redis Slave 설정 (Master의 복제본)
# - master가 죽으면 Sentinel에 의해 승격 가능
# - masterauth+requirepass는 master와 동일한 비밀번호를 사용

# Redis가 사용할 포트
port 6379

# 모든 인터페이스에서 접근 허용
bind 0.0.0.0

# 보호 모드 비활성화 (도커 내부 접근 허용)
protected-mode no

# 데이터 저장 경로
dir /data

# Master의 IP와 포트를 지정
replicaof 192.168.0.11 6379

# master · Sentinel 에게 알릴 이 replica 의 주소 — 호스트 IP (호스트별 .env 의 REDIS_ANNOUNCE_IP)
# 지정하지 않으면 컨테이너 IP 를 알려 Sentinel 이 replica 에 닿지 못한다.
replica-announce-ip ${REDIS_ANNOUNCE_IP}
replica-announce-port 6379

# 인증 관련
# - masterauth: slave가 master에 접속할 때 사용하는 비밀번호
# - requirepass: 이 슬레이브에 접근하는 클라이언트가 사용해야 할 비밀번호
masterauth ${REDIS_MASTER_PASSWORD}
requirepass ${REDIS_MASTER_PASSWORD}

# 복제 모드에서는 appendonly on 유지 (데이터 복제 안정성 향상)
appendonly yes

# Slave는 읽기 전용(readonly) 기본 설정
# - Sentinel이 승격 시 자동으로 writable 전환
# replica-read-only yes
