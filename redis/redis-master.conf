# Redis Master 설정 (AOF 사용하여 데이터 영속성 확보)
# - 템플릿 방식으로 ${REDIS_MASTER_PASSWORD} 주입 권장

# Redis가 사용할 포트
port 6379

# 모든 인터페이스에서 접근 허용
bind 0.0.0.0

# protected-mode 비활성화 (도커 내부 접근용)
protected-mode no

# 데이터 파일 저장 경로 (docker volume /data)
dir /data

# 백그라운드 저장 옵션 (AOF)
# Redis는 기본적으로 메모리 DB이므로, 데이터 유실 방지 위해 appendonly on
appendonly yes

# RDB와 AOF 병행 사용 시 안정성 높은 대신 성능 약간 하락
# appendfsync everysec  # 기본값 그대로 사용

# 클러스터 모드 사용 안 함 (Sentinel 구조에서는 cluster-mode 불필요)
cluster-enabled no

# 인증 관련 (환경변수로 치환해서 사용)
# - requirepass : 클라이언트 접속시 인증 필요
# - masterauth  : replica가 master에 인증할 때 사용
requirepass ${REDIS_MASTER_PASSWORD}
masterauth ${REDIS_MASTER_PASSWORD}

# failover 로 replica 가 되면 master · Sentinel 에게 알릴 주소 — 호스트 IP (호스트별 .env 의 REDIS_ANNOUNCE_IP)
replica-announce-ip ${REDIS_ANNOUNCE_IP}
replica-announce-port 6379
